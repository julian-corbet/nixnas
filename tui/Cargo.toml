[package]
name = "nixnas-tui"
version = "0.1.0"
edition = "2021"
description = "nixnas — guided TUI to configure, build, and flash a nixnas USB stick."
license = "Apache-2.0"

[[bin]]
name = "nixnas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.30.2"
crossterm = "0.29.0"
