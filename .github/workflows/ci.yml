# CI for the public nixnas core: prove the zero-secrets demo EVALUATES (full module
# eval incl. every assertion — the fail-closed guards fire here) and the TUI compiles.
# Deliberately eval-only for Nix: building the demo toplevel means realizing a whole
# NixOS closure incl. the CachyOS kernel — real hardware-adjacent validation happens
# in the QEMU rig (test/), not on a CI runner.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Every test script must PARSE on every push/PR — a syntax error in test/*.sh once
  # left three QEMU jobs silently dead. The heavy suites re-run this gate themselves
  # before executing any script; this job catches it even when they are not triggered.
  test-syntax:
    name: bash -n all test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check test scripts (bash -n)
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

  eval:
    name: nix eval (demo host, all assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Evaluate the demo toplevel (assertions + module system, no build)
        run: |
          nix eval --raw \
            .#nixosConfigurations.demo.config.system.build.toplevel.drvPath
      - name: Evaluate the image script derivation
        run: |
          nix eval --raw \
            .#nixosConfigurations.demo.config.system.build.diskoImagesScript.drvPath
      - name: Evaluate the HOT-mode host (store.location = "hot"; location.nix + its assertions)
        run: |
          nix eval --raw \
            .#nixosConfigurations.demo-hot.config.system.build.toplevel.drvPath
      - name: Build the rescue maintainer (shellcheck the cross-store maintain script)
        run: |
          nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.demo-rescue-maintainer
      - name: Build the hot installer (shellcheck nixnas-install-hot)
        run: |
          nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.demo-hot-installer

  tui:
    name: cargo check + clippy (tui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check --locked
      - run: cargo clippy --locked -- -D warnings
