# Heavy boot-chain verification — for FREE, on GitHub's KVM-capable public runners.
# Builds the zero-secrets demo image and boots it in QEMU + OVMF + swtpm to prove the
# REAL boot chain end to end:
#   * the TPM-sealed initrd-SSH host key survives a genuine power-cycle (seal on boot #1,
#     the initrd unseals it on boot #2 → initrd-SSH → store unlocked over the network → login),
#   * and is genuinely bound to THIS box's TPM (--tamper: a fresh/wrong TPM must NOT unseal —
#     a non-unlock is the pass, the fail-closed proof).
# swtpm is a full TPM2 and OVMF does real UEFI, so this needs no physical hardware. The only
# things a VM can't cover are the firmware setup password and final on-the-real-board boot.
name: boot-test

on:
  push:
    branches: [ main ]
    paths: [ 'modules/**', 'hosts/**', 'flake.nix', 'flake.lock', 'test/**', '.github/workflows/boot-test.yml' ]
  pull_request:
    paths: [ 'modules/**', 'hosts/**', 'flake.nix', 'flake.lock', 'test/**' ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'   # weekly, catches upstream (nixpkgs/kernel-cache) drift

jobs:
  boot:
    name: build demo image + QEMU boot/seal/tamper
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Gate: a test script with a syntax error must fail the job HERE, loudly — not
      # leave it silently dead. (Runs before any expensive setup.)
      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

      # The demo closure + CachyOS kernel + the .raw need more than the default ~14 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true    # reclaim as much as possible for the closure + .raw
          docker-images: true
          swap-storage: false

      # QEMU needs /dev/kvm accessible to the runner user for accelerated boots.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU + swtpm + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 swtpm ovmf
          ls -l /usr/share/OVMF/ || true   # test/*.sh auto-detect the OVMF_CODE_4M.fd names

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # Pull the CachyOS kernel from the maintainer's lantian cache (else it compiles from
          # source — slow, RAM-heavy). accept-flake-config honours the flake's own substituters;
          # extra-sandbox-paths lets disko's image-builder VM reach /dev/kvm if it wants it.
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
            extra-sandbox-paths = /dev/kvm

      - name: Enforce the 8 GiB-stick closure budget (before the heavy image build)
        run: nix build .#checks.x86_64-linux.demo-closure-budget --accept-flake-config --print-build-logs -L

      - name: Build the demo image (sandbox diskoImages → nixnas.raw, demo passphrase)
        run: |
          set -o pipefail
          echo "== KVM check =="; ls -l /dev/kvm; kvm-ok 2>/dev/null || true
          echo "== free space =="; df -h / /mnt 2>/dev/null || df -h
          # The image is built by a disko VM (vmTools). On failure, dump the REAL builder
          # log (nix streams only the serial console with --print-build-logs).
          if ! nix build .#image --accept-flake-config --print-build-logs 2>&1 | tee /tmp/build.log; then
            echo "===================== FULL BUILDER LOG ====================="
            drv=$(grep -oE '/nix/store/[a-z0-9]+-demo-disko-images\.drv' /tmp/build.log | head -1)
            [ -n "$drv" ] && nix log "$drv" 2>/dev/null | tail -120
            echo "== free space after =="; df -h / /mnt 2>/dev/null || df -h
            exit 1
          fi
          find -L result -name '*.raw' -printf '%s bytes  %p\n'

      - name: Boot #1 seals → boot #2 initrd unseals → unlock over SSH → login
        run: test/seal-2boot-test.sh "$(find -L result -name '*.raw' | head -1)"

      - name: Fail-closed — a wrong TPM must NOT unseal the host key (--tamper)
        run: test/seal-2boot-test.sh "$(find -L result -name '*.raw' | head -1)" --tamper

  # HOT mode: prove the MAIN boots its /nix from an EXTERNAL, operator-key-unlocked LUKS
  # device (modules/store/location.nix). Builds the demo-hot toplevel (a full build check),
  # assembles a LUKS2+ext4 /nix disk with the closure, and direct-kernel-boots it — the initrd
  # must unlock with the operator passphrase and reach login. See test/hot-boot-test.sh.
  # A SECOND boot in the same job runs the consolePrimary="video" variant (extendModules):
  # same serial login gate + the LUKS prompt must still appear on the serial log — the
  # runtime proof that SOL/serial users survive the video console default.
  hot-boot:
    name: hot mode — external LUKS /nix boot (serial-primary + video-primary consoles)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU + disk tools (gdisk/cryptsetup/e2fsprogs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 gdisk cryptsetup-bin e2fsprogs dosfstools
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
            extra-sandbox-paths = /dev/kvm
      # sudo for losetup/cryptsetup/mount; preserve PATH (+sbin for the disk tools) + HOME so
      # `nix` (daemon client) works as root and cryptsetup/sgdisk/losetup are found.
      # Boots TWICE: serial-primary (demo-hot as-is), then the video-primary variant.
      - name: Build the hot toplevel + boot /nix from the external LUKS device (serial + video console)
        run: sudo env "PATH=$PATH:/usr/sbin:/sbin" "HOME=$HOME" FLAKE=. PASS=nixnas-hot test/hot-boot-test.sh

  # Matrix eval: cheap eval-only proof of six operator-persona variants (no builds, no QEMU).
  # Confirms option wiring, assertion guards, and module interactions across the matrix.
  matrix-eval:
    name: matrix variant eval checks (stick-4/16/32g / hot-ext4 / hot-zfs-property / persist-nested)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
      # No KVM, no OVMF, no disk tools needed — eval-only probes via nix eval.
      - name: Matrix variant eval checks
        run: FLAKE=. test/matrix-eval-test.sh

  # ZFS hot-mode: boot /nix from a ZFS pool whose vdevs are LUKS-encrypted.
  # Two LUKS members (single passphrase via kernel-keyring serialised unlock); pool import
  # in the initrd; legacy-mount dataset at /nix. See test/hot-boot-zfs-test.sh.
  zfs-hot:
    name: ZFS hot mode — boot /nix from LUKS-encrypted ZFS pool (initrd import + keyring)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU + ZFS + disk tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 zfsutils-linux gdisk cryptsetup-bin dosfstools
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
            extra-sandbox-paths = /dev/kvm
      # sudo for losetup/cryptsetup/zpool/zfs/mount; preserve PATH + HOME for nix + disk tools.
      - name: Build the ZFS hot toplevel + boot /nix from LUKS-encrypted ZFS pool
        run: sudo env "PATH=$PATH:/usr/sbin:/sbin" "HOME=$HOME" FLAKE=. PASS=nixnas-hot test/hot-boot-zfs-test.sh
