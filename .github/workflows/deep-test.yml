# Long-running boot-chain integration tests — failure-injection and upgrade-soak.
# These tests each take 45-120 minutes and run on a separate schedule so they do not block
# every push. They also run on workflow_dispatch and on push/PR paths that touch test/** so
# a developer who edits a test script can trigger them explicitly.
#
#   failure-*      — power-cut f2fs recovery, pool-absent initrd stall, no-TPM passphrase fallback
#   upgrade-soak   — N=5 generation cycles, UKI pruning + store-growth table
name: deep-test

on:
  schedule:
    - cron: '0 2 * * 1'   # weekly Sunday night/Monday morning (offset from boot-test's Monday 04:00)
  workflow_dispatch:
  push:
    paths: [ 'test/**' ]
  pull_request:
    paths: [ 'test/**' ]

jobs:
  # ── failure-injection: power-cut f2fs recovery ────────────────────────────────────────
  failure-power-cut:
    name: failure-injection — power-cut mid-write (f2fs recovery)
    runs-on: ubuntu-latest
    # Measured, not guessed: compiling the CachyOS kernel from source took this job 3h10m18
    # on a 4-core runner (run 32314629247/32314654357, 2026-08-20), against 27m51 back when a
    # binary cache supplied the kernel. 3x that p95 is unreachable - GitHub caps a public-repo
    # job at 360 minutes - so this is the platform ceiling less a margin: our own timeout fires
    # with a clear signal instead of GitHub's, and the margin over the worst observed job
    # (4h32m) is thin on purpose. A job that cannot be bounded tighter than 4.5 hours is the
    # real argument for serving this kernel from a cache we control; see the commit that
    # removed the third-party one.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + swtpm + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 swtpm ovmf

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # These jobs build a BOOT IMAGE, so only cache.nixos.org's signing key may hand
          # them a store path: no third-party substituter, and no blanket accept of
          # substituters a flake declares for itself (same stance as boot-test.yml). The
          # CachyOS kernel is compiled from source as a result.
          extra_nix_config: |
            extra-sandbox-paths = /dev/kvm

      - name: Build the demo image
        run: |
          nix build .#image --print-build-logs
          find -L result -name '*.raw' -printf '%s bytes  %p\n'

      - name: power-cut-mid-write — f2fs must recover after kill -9 mid-write
        run: |
          test/failure-injection-test.sh power-cut-mid-write \
            "$(find -L result -name '*.raw' | head -1)" --pass nixnas-demo

  # ── failure-injection: pool-absent initrd stall ───────────────────────────────────────
  failure-pool-absent:
    name: failure-injection — pool-absent (HOT main must NOT reach login without store disk)
    runs-on: ubuntu-latest
    # Measured, not guessed: compiling the CachyOS kernel from source took this job 3h38m29
    # on a 4-core runner (run 32314629247/32314654357, 2026-08-20), against 9m34 back when a
    # binary cache supplied the kernel. 3x that p95 is unreachable - GitHub caps a public-repo
    # job at 360 minutes - so this is the platform ceiling less a margin: our own timeout fires
    # with a clear signal instead of GitHub's, and the margin over the worst observed job
    # (4h32m) is thin on purpose. A job that cannot be bounded tighter than 4.5 hours is the
    # real argument for serving this kernel from a cache we control; see the commit that
    # removed the third-party one.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-sandbox-paths = /dev/kvm

      - name: Build demo-hot toplevel
        run: |
          TOP=$(nix build --no-link --print-out-paths \
            .#nixosConfigurations.demo-hot.config.system.build.toplevel)
          echo "DEMO_HOT_TOP=$TOP" >> "$GITHUB_ENV"

      - name: pool-absent — HOT main must NOT reach login without its store disk
        run: |
          test/failure-injection-test.sh pool-absent --toplevel "$DEMO_HOT_TOP"

  # ── failure-injection: no-TPM graceful degradation ───────────────────────────────────
  failure-no-tpm:
    name: failure-injection — no-tpm (passphrase fallback, no TPM hard dependency)
    runs-on: ubuntu-latest
    # Measured, not guessed: compiling the CachyOS kernel from source took this job 4h22m50
    # on a 4-core runner (run 32314629247/32314654357, 2026-08-20), against 28m06 back when a
    # binary cache supplied the kernel. 3x that p95 is unreachable - GitHub caps a public-repo
    # job at 360 minutes - so this is the platform ceiling less a margin: our own timeout fires
    # with a clear signal instead of GitHub's, and the margin over the worst observed job
    # (4h32m) is thin on purpose. A job that cannot be bounded tighter than 4.5 hours is the
    # real argument for serving this kernel from a cache we control; see the commit that
    # removed the third-party one.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + OVMF (no swtpm needed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-sandbox-paths = /dev/kvm

      - name: Build the demo image
        run: |
          nix build .#image --print-build-logs
          find -L result -name '*.raw' -printf '%s bytes  %p\n'

      - name: no-tpm — passphrase fallback must work with no TPM device
        run: |
          test/failure-injection-test.sh no-tpm \
            "$(find -L result -name '*.raw' | head -1)" --pass nixnas-demo

  # ── upgrade-soak: N=5 generation cycles, UKI pruning, store-growth table ─────────────
  upgrade-soak:
    name: upgrade soak — N=5 generation cycles (UKI pruning + store growth)
    runs-on: ubuntu-latest
    # Measured, not guessed: compiling the CachyOS kernel from source took this job 4h25m12
    # on a 4-core runner (run 32314629247/32314654357, 2026-08-20), against 37m33 back when a
    # binary cache supplied the kernel. 3x that p95 is unreachable - GitHub caps a public-repo
    # job at 360 minutes - so this is the platform ceiling less a margin: our own timeout fires
    # with a clear signal instead of GitHub's, and the margin over the worst observed job
    # (4h32m) is thin on purpose. A job that cannot be bounded tighter than 4.5 hours is the
    # real argument for serving this kernel from a cache we control; see the commit that
    # removed the third-party one.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check test scripts (bash -n) before running them
        run: |
          rc=0
          for f in test/*.sh; do
            if bash -n "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::bash -n failed — syntax error in $f"
              rc=1
            fi
          done
          exit "$rc"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU + swtpm + OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 swtpm ovmf

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-sandbox-paths = /dev/kvm

      - name: Build the demo image
        run: |
          if ! nix build .#image --print-build-logs 2>&1 | tee /tmp/build.log; then
            echo "===================== FULL BUILDER LOG ====================="
            drv=$(grep -oE '/nix/store/[a-z0-9]+-demo-disko-images\.drv' /tmp/build.log | head -1)
            [ -n "$drv" ] && nix log "$drv" 2>/dev/null | tail -80
            exit 1
          fi
          find -L result -name '*.raw' -printf '%s bytes  %p\n'

      - name: N=5 generation cycles — boots newest, UKI count, bootctl, store growth
        run: test/upgrade-soak-test.sh "$(find -L result -name '*.raw' | head -1)"
