# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixnas"

[checks.native]
kind = "nix"
mode = "named"
checks = ["tui-build"]

[checks.eval]
kind = "nix"
mode = "eval"

[checks.list]
kind = "nix"
mode = "list"

[checks.all-systems]
kind = "nix"
mode = "all-systems"

[checks.matrix-build]
kind = "nix"
mode = "native"

[checks.syntax]
kind = "commands"
commands = [["bash", "-ceu", "for file in test/*.sh; do bash -n \"$file\"; done"]]

[checks.configuration]
kind = "commands"
commands = [["nix", "eval", "--no-update-lock-file", "--raw", ".#nixosConfigurations.demo.config.system.build.toplevel.drvPath"], ["nix", "eval", "--no-update-lock-file", "--raw", ".#nixosConfigurations.demo.config.system.build.diskoImagesScript.drvPath"], ["nix", "eval", "--no-update-lock-file", "--raw", ".#nixosConfigurations.demo-hot.config.system.build.toplevel.drvPath"]]

[checks.tui]
kind = "commands"
commands = [["bash", "-ceu", "cd tui; cargo clippy --locked -- -D warnings"]]

[checks.tui-secrets]
kind = "commands"
commands = [["cargo", "test", "--manifest-path", "tui/Cargo.toml", "--locked", "sudo::tests"]]

# Explicit dependency maintenance; never selected by routine checks.
[checks.tui-lockfile]
kind = "commands"
commands = [["bash", "-ceu", "cargo update --offline --manifest-path tui/Cargo.toml -p nixnas-tui; printf 'CCID_LOCKFILE_BEGIN\\n'; base64 -w0 tui/Cargo.lock; printf '\\nCCID_LOCKFILE_END\\n'"]]
